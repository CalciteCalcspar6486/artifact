<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <meta name="description" content="探索游戏美术、像素艺术、异想世界与游戏音乐。">
  <title>ARTIFACT | 异想艺术档案馆</title>
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="orbit" viewBox="0 0 48 48">
      <path d="M24 5 38 24 24 43 10 24Z M24 5v38 M10 24h28" fill="none" stroke="currentColor" stroke-width="1.35"/>
      <ellipse cx="24" cy="24" rx="22" ry="7.4" transform="rotate(-28 24 24)" fill="none" stroke="currentColor" stroke-width="1.35"/>
      <circle cx="39" cy="13" r="2.5" fill="currentColor"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 24 24">
      <path d="M20.8 5.8a4.7 4.7 0 0 0-6.7 0L12 8l-2.1-2.2a4.7 4.7 0 0 0-6.7 6.7L12 21l8.8-8.5a4.7 4.7 0 0 0 0-6.7Z" fill="var(--heart-fill, none)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="arrow" viewBox="0 0 24 24">
      <path d="M6 18 18 6M7 6h11v11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="zoom" viewBox="0 0 24 24">
      <path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="close" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z" fill="currentColor"/></symbol>
  </svg>
  <a class="skip" href="#main">跳到内容</a>
  <header class="top">
    <div class="frame top-inner">
      <a class="brand" href="#today" aria-label="ARTIFACT，返回今日">
        <svg aria-hidden="true"><use href="#orbit"/></svg><span>ARTIFACT</span>
      </a>
      <nav aria-label="主导航">
        <a href="#today" aria-current="page">今日</a>
        <a href="#archive">往期</a>
        <a href="#saved">收藏</a>
      </nav>
    </div>
  </header>
  <main class="frame" id="main" tabindex="-1">
    <header class="masthead">
      <div>
        <h1 id="page-title">ARTIFACT</h1>
        <p id="page-subtitle">异想艺术档案馆</p>
      </div>
      <div class="date-block" id="date-block">
        <span>中国时间</span>
        <time id="today-date"></time>
      </div>
    </header>
    <div id="notice" role="status" hidden></div>
    <noscript><p class="notice">启用 JavaScript 后即可浏览档案。</p></noscript>
    <section id="hero" aria-label="本期封面" hidden></section>
    <section id="controls" class="controls" hidden>
      <div class="collection-heading">
        <h2 id="collection-title">本期作品</h2>
        <p id="collection-meta"></p>
      </div>
      <div id="archive-tools" hidden>
        <label for="issue-select">期次</label>
        <select id="issue-select"></select>
      </div>
      <div id="saved-tools" hidden>
        <button id="export-saved" class="quiet" type="button">导出</button>
        <button id="import-saved" class="quiet" type="button">导入</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
    </section>
    <div id="filters" class="filters" role="group" aria-label="作品分类" hidden></div>
    <p id="empty" class="empty" role="status">正在打开档案…</p>
    <div id="gallery" aria-label="视觉作品"></div>
    <section id="listening" aria-labelledby="music-title" hidden>
      <h2 id="music-title">聆听</h2>
      <div id="music-list"></div>
    </section>
  </main>
  <footer class="frame footer">
    <span>异想艺术档案馆</span>
    <span>视觉与声音的私人选集</span>
  </footer>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-top">
      <span id="viewer-type"></span>
      <button type="button" class="icon-button" id="viewer-close" aria-label="关闭大图" autofocus>
        <svg aria-hidden="true"><use href="#close"/></svg>
      </button>
    </div>
    <div id="viewer-image"></div>
    <div class="viewer-caption">
      <div><h2 id="viewer-title"></h2><p id="viewer-credit"></p></div>
      <div class="viewer-actions"></div>
    </div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
