name: ARTIFACT daily

on:
  push:
    branches: [main]
  schedule:
    # 04:00 UTC = 12:00 China Standard Time.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: artifact-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check collector
        run: python3 -B -m unittest discover -s scripts
      - name: Collect today's issue
        if: github.event_name != 'push'
        run: python3 -B scripts/collect.py
      - name: Save issue history
        if: github.event_name != 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Publish daily art issue'
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html style.css app.js manifest.json sw.js _site/
          cp -r assets data _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
